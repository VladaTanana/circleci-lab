name: CI Pipeline

# Пайплайн запускается при каждом push или pull request в ветку main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Клонируем репозиторий (аналог checkout в CircleCI)
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Настраиваем окружение Python (версия 3.11)
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Устанавливаем зависимости
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Запускаем тесты с помощью pytest
      - name: Run tests with pytest
        run: |
          pytest